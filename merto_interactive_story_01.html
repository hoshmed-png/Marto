<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4eee3"><title>مرتو | اگر همه مخالف‌اند</title><style>
:root{--paper:#f4eee3;--ink:#171717;--red:#e94f37;--yellow:#f5c84b;--blue:#cde8ef;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.9}.shell{max-width:760px;margin:auto;padding:16px 13px 40px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);padding:5px 0 12px;gap:8px}.brand{font-size:1.25rem;font-weight:900}.tag{font-size:.78rem;border:2px solid;border-radius:99px;background:var(--yellow);padding:2px 10px;font-weight:bold}.bar{height:8px;background:#ded5c8;border:1px solid;margin:16px 0 22px;border-radius:99px;overflow:hidden}.progress{height:100%;width:8%;background:var(--red);transition:width .2s}.panel{background:var(--white);border:3px solid;border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;margin-bottom:18px}.art{display:block;width:100%;height:auto;background:var(--blue);border-bottom:3px solid var(--ink)}.content{padding:19px}.eyebrow{font-size:.8rem;font-weight:bold;color:#8b392b;margin:0 0 5px}.title{font-size:clamp(1.45rem,5vw,2.25rem);line-height:1.5;margin:0 0 12px;font-weight:900}.body{font-size:1rem;margin:0 0 12px}.bubble{background:#fff;border:2px solid;border-radius:14px;padding:10px 13px;margin:14px 0;font-weight:bold}.choices{display:grid;gap:10px;margin-top:16px}.choice{border:2px solid;border-radius:12px;background:#fff;padding:12px;text-align:right;font:inherit;font-weight:bold;cursor:pointer}.choice:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}.choice small{display:block;font-weight:normal;color:#555;margin-top:3px}.primary,.secondary{font:inherit;font-weight:bold;border:2px solid;border-radius:12px;padding:10px 16px;cursor:pointer}.primary{background:var(--red);color:white}.secondary{background:transparent}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.result{border-right:5px solid var(--red);padding:9px 13px;background:#fff4e7;margin:14px 0}.note{font-size:.85rem;color:#555}.chip{display:inline-block;border:1px solid;border-radius:99px;padding:1px 10px;font-size:.8rem;margin:3px}.footer{text-align:center;color:#555;font-size:.8rem;margin-top:20px}@media(min-width:600px){.content{padding:25px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">مِرتو <span style="font-size:.8rem;font-weight:normal">/ تجربه تعاملی</span></div><div class="tag">داستان ۰۱</div></header><div class="bar"><div class="progress" id="progress"></div></div><main id="stage" aria-live="polite"></main><div class="footer">این داستان فرضی است؛ آزمون شخصیت یا تشخیص روان‌شناختی نیست.</div></div><script>
const stage=document.getElementById('stage'),bar=document.getElementById('progress');const s={a:null,b:null,c:null};
function art(label){return `<svg class="art" viewBox="0 0 720 330" role="img" aria-label="تصویر وب‌کامیک از چند دوست در یک گفت‌وگو" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="330" fill="#cde8ef"/><path d="M0 260H720V330H0Z" fill="#f5d5a7"/><rect x="35" y="38" width="110" height="100" rx="6" fill="#fffdf8" stroke="#171717" stroke-width="5"/><path d="M90 38V138M35 88H145" stroke="#171717" stroke-width="4"/><g stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(220 135)"><circle r="29" fill="#f1c7a3"/><path d="M-29 -5Q-30 -37 0 -34Q28 -32 29 -4L17 -20L-18 -18Z" fill="#171717"/><path d="M-13 1l7 0M7 0l7 1M-7 14h14" fill="none"/><path d="M-30 37Q0 25 30 37L42 117H-42Z" fill="#e94f37"/><path d="M-30 55L-58 81M30 55L55 81" fill="none"/></g><g transform="translate(360 135)"><circle r="29" fill="#efc5a2"/><path d="M-29 -5Q-27 -37 2 -34Q28 -30 29 -5L18 -19L-19 -17Z" fill="#171717"/><path d="M-13 1h7M7 0h7M-8 14Q0 9 8 14" fill="none"/><path d="M-30 37Q0 25 30 37L42 117H-42Z" fill="#f5c84b"/><path d="M-30 55L-49 81M30 55L49 81" fill="none"/></g><g transform="translate(500 135)"><circle r="29" fill="#eec19a"/><path d="M-29 -5Q-30 -37 0 -34Q27 -33 29 -5L17 -19L-19 -19Z" fill="#171717"/><path d="M-13 1h7M7 0h7M-8 14h16" fill="none"/><path d="M-30 37Q0 25 30 37L42 117H-42Z" fill="#9fd6e8"/><path d="M-30 55L-51 80M30 55L50 80" fill="none"/></g></g><rect x="190" y="15" width="340" height="48" rx="12" fill="#fffdf8" stroke="#171717" stroke-width="4"/><text x="360" y="46" font-family="Tahoma,Arial" font-size="21" text-anchor="middle" font-weight="bold" fill="#171717">${label}</text></svg>`}
function panel(eyebrow,title,body,extra='',label='«همه می‌گن اون مقصره!»'){return `<section class="panel">${art(label)}<div class="content"><p class="eyebrow">${eyebrow}</p><h1 class="title">${title}</h1><p class="body">${body}</p>${extra}</div></section>`}function prog(n){bar.style.width=n+'%'}
function start(){prog(8);stage.innerHTML=panel('یک موقعیت آشنا','اگر همه بگن اون مقصره، تو چی؟','تصور کن توی جمع دوستانت، سام دیر رسیده و بحثی بالا گرفته. چند نفر با اطمینان می‌گن سام همیشه خودخواه و بی‌ملاحظه‌ست. تو اما می‌دونی شاید امروز دلیل موجهی داشته باشه؛ فقط مطمئن نیستی.','<div class="bubble">یکی می‌گه: «همه‌مون همینو می‌گیم؛ پس معلومه حق با ماست!»</div><p class="body">تو همون‌جایی. بقیه منتظرن ببینن چی می‌گی.</p><div class="actions"><button class="primary" onclick="one()">وارد موقعیت شو ←</button></div>')}
function one(){prog(25);stage.innerHTML=panel('تصمیم اول از سه تصمیم','اولین واکنشت چیه؟','جواب درست رو حدس نزن؛ انتخاب کن احتمالاً همون لحظه چه کار می‌کردی.','<div class="choices"><button class="choice" onclick="pickA(&quot;agree&quot;)">۱. با جمع همراه می‌شم.<small>شاید نمی‌خوام بحث راه بیفته.</small></button><button class="choice" onclick="pickA(&quot;question&quot;)">۲. می‌پرسم دقیقاً چه اتفاقی افتاده؟<small>قبل از قضاوت اطلاعات بیشتری می‌خوام.</small></button><button class="choice" onclick="pickA(&quot;defend&quot;)">۳. از سام دفاع می‌کنم.<small>به نظرم جمع داره ناعادلانه قضاوت می‌کنه.</small></button></div>','«تو چی فکر می‌کنی؟»')}
function pickA(v){s.a=v;two()}function two(){prog(48);let t=s.a==='agree'?'فعلاً همراه جمع شدی؛ اما دوستی می‌پرسه: «پس قبول داری سام همیشه همین‌طوریه؟»':s.a==='question'?'وقتی سؤال می‌پرسی، دوستت می‌گه: «چرا داری ازش دفاع می‌کنی؟ ما که همه دیدیم!»':'وقتی از سام دفاع می‌کنی، یکی می‌گه: «یعنی ما هممون اشتباه می‌کنیم؟»';stage.innerHTML=panel('تصمیم دوم از سه تصمیم','حالا فشار بیشتر می‌شه',t+' انگار انتخاب تو هم داره قضاوت می‌شه.','<div class="choices"><button class="choice" onclick="pickB(&quot;silence&quot;)">۱. بحث رو عوض می‌کنم.<small>نمی‌خوام هدف بعدی جمع بشم.</small></button><button class="choice" onclick="pickB(&quot;evidence&quot;)">۲. می‌گم شواهد کافی نداریم.<small>یک اتفاق به‌تنهایی شخصیت کسی رو ثابت نمی‌کنه.</small></button><button class="choice" onclick="pickB(&quot;ask&quot;)">۳. از سام می‌پرسم خودش چی می‌گه.<small>می‌خوام روایت طرف مقابل رو هم بشنوم.</small></button></div>','«چرا مخالف مایی؟»')}
function pickB(v){s.b=v;three()}function three(){prog(70);stage.innerHTML=panel('تصمیم سوم از سه تصمیم','بعداً حقیقت روشن می‌شه','سام می‌گه دیر رسیدنش به‌خاطر مشکلی غیرمنتظره بوده؛ اما قبول می‌کنه می‌توانست زودتر خبر بده. پس نه کاملاً بی‌تقصیره، نه برچسب «همیشه خودخواه» منصفانه‌ست.','<div class="bubble">یکی می‌پرسه: «حالا که فهمیدیم چی شده، هنوز همون نظر قبلی رو داری؟»</div><div class="choices"><button class="choice" onclick="pickC(&quot;update&quot;)">۱. نظرم رو اصلاح می‌کنم.<small>اطلاعات تازه باید در قضاوتم اثر بذاره.</small></button><button class="choice" onclick="pickC(&quot;hold&quot;)">۲. روی حرف قبلیم می‌مونم.<small>تغییر نظر جلوی جمع سخته.</small></button><button class="choice" onclick="pickC(&quot;nuance&quot;)">۳. هم دلیلش رو می‌پذیرم، هم مسئولیتش رو.<small>می‌شه چند حقیقت رو هم‌زمان دید.</small></button></div>','«خب، حالا چی؟»')}
function pickC(v){s.c=v;end()}function end(){prog(100);let a={agree:'همراهی با جمع',question:'جست‌وجوی اطلاعات',defend:'دفاع از فرد غایب'}[s.a],b={silence:'پرهیز از درگیری',evidence:'تکیه بر شواهد',ask:'شنیدن روایت طرف مقابل'}[s.b],c={update:'بازنگری در قضاوت',hold:'پافشاری بر نظر قبلی',nuance:'دیدن چند جنبه'}[s.c];let h,ins;if(['evidence','ask'].includes(s.b)||['update','nuance'].includes(s.c)){h='تو برای پیچیدگی جا باز کردی.';ins='در این سناریو دست‌کم یک بار مکث کردی، اطلاعات بیشتری خواستی یا حاضر شدی تصویر اولیه‌ات رو اصلاح کنی. این به معنی مصون‌بودن از فشار جمع نیست؛ فقط مسیر همین داستان رو توصیف می‌کنه.'}else if(s.a==='agree'||s.b==='silence'||s.c==='hold'){h='فشار جمع می‌تونه مسیر قضاوت رو عوض کنه.';ins='همراهی یا سکوت همیشه به معنی باور واقعی نیست؛ گاهی آدم برای حفظ رابطه یا کم‌کردن تنش کوتاه میاد. از این انتخاب نمی‌شه درباره شخصیتت حکم کلی داد.'}else{h='تو سریع وارد موضع‌گیری شدی.';ins='دفاع از کسی که غایبه می‌تونه منصفانه باشه؛ اما شنیدن اطلاعات تازه کمک می‌کنه دفاع‌کردن به قضاوت شتاب‌زده‌ی معکوس تبدیل نشه.'}stage.innerHTML=panel('پایان داستان تو',h,ins,`<div class="result"><strong>مسیر تو:</strong><br>• ${a}<br>• ${b}<br>• ${c}</div><h2>این تجربه چه چیزی نشون می‌ده؟</h2><p class="body">در آزمایش‌های کلاسیک سولومون اَش، بعضی شرکت‌کنندگان در قضاوت‌های ساده‌ی دیداری، دست‌کم گاهی با پاسخ آشکارا نادرست اکثریت همراه شدند. این پژوهش نشان می‌دهد فشار اجتماعی می‌تواند بر پاسخ افراد اثر بگذارد؛ نه اینکه همه همیشه از جمع پیروی می‌کنند.</p><p class="note">این داستان فرضی است و آزمایش اَش دقیقاً همین موقعیت دوستانه را بررسی نکرده. انتخاب‌های این بازی هم آزمون روان‌شناختی معتبر نیستند.</p><span class="chip">فشار اجتماعی</span><span class="chip">قضاوت منصفانه</span><span class="chip">بازنگری در باور</span><h2>حالا نوبت تجربه‌ی توئه</h2><p class="body">تا حالا شده توی جمع با چیزی مخالف باشی ولی از گفتنش منصرف بشی؟ یا تنها کسی باشی که مخالفت می‌کنه؟ برامون بنویس. با اجازه‌ی تو، ممکنه تجربه‌ات رو به داستانی برای مرتو تبدیل کنیم. می‌تونی اسم‌ها و جزئیات شناسایی‌کننده رو حذف کنی.</p><div class="actions"><button class="primary" onclick="start()">از اول تجربه کن ↻</button><button class="secondary" onclick="sources()">منابع</button></div><div id="src" hidden class="result"><strong>منابع برای مطالعه بیشتر</strong><p>Asch, S. E. (1951). Effects of group pressure upon the modification and distortion of judgments. In H. Guetzkow (Ed.), Groups, Leadership and Men.</p><p>Bond, R., & Smith, P. B. (1996). Culture and conformity: A meta-analysis of studies using Asch’s line judgment task. Psychological Bulletin, 119(1), 111–137.</p><p class="note">این پژوهش‌ها درباره همرنگی اجتماعی‌اند؛ از آن‌ها نمی‌شود شخصیت فرد را از یک انتخاب تشخیص داد.</p></div>`,'«لحظه‌ی انتخاب»')}
function sources(){let e=document.getElementById('src');e.hidden=!e.hidden}start();
</script></body></html>
